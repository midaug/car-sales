name: start_spider

on:
  # 定时执行：cron 使用 UTC 时间
  # UTC 01:00 / 13:00 = 北京时间 09:00 / 21:00，即每天两次
  schedule:
    - cron: '0 1,13 * * *'
  # 支持在 Actions 页面手动执行
  workflow_dispatch:
  repository_dispatch:
    types: [start_spider]

# 需要写权限，才能把抓取到的数据提交回仓库
permissions:
  contents: write

# 同一时间只跑一个，避免两个任务同时提交产生冲突
concurrency:
  group: start_spider
  cancel-in-progress: false

jobs:
  # This workflow contains a single job called "build"
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # 输出IP
      - name: IP
        run: sudo curl -s ifconfig.me

      # 设置服务器时区为东八区
      - name: Set time zone
        run: sudo timedatectl set-timezone 'Asia/Shanghai'

      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout
        uses: actions/checkout@v4

      # 使用python环境
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: 'x64'

      # 打印pyton版本
      - name: Display Python version
        run: python -c "import sys; print(sys.version)"

      - name: install python libs
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dateutil

      # 执行python脚本
      - name: start python
        run: python spider_dcd.py
        env:
          # 可选：站点域名可以存到 Secrets 里（DCD_BASE_URL），不配置就用脚本里 base64 解码的默认值
          DCD_BASE_URL: ${{ secrets.DCD_BASE_URL }}

      # 数据有变化才提交，避免每天产生空提交
      - name: Commit files
        if: always()
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "数据没有变化，跳过提交"
            exit 0
          fi
          echo "action start time => `date '+%Y-%m-%d %H:%M:%S'`" >> ./data/log.txt
          git config --local user.email "days0814@gmail.com"
          git config --local user.name "midaug"
          git add .
          git commit -m "`date '+%Y-%m-%d %H:%M:%S'` , spider_dcd.py start"
          git push
